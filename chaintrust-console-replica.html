<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChainTrust Console Replica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --radius: 18px;
      --bg: #fffcf6;
      --fg: #1d1c20;
      --muted: #5c6370;
      --line: #1218271a;
      --panel: #ffffffd1;
      --panel-strong: #ffffffe8;
      --panel-muted: #f7f8fc;
      --shell: #ffffffad;
      --primary: #171719;
      --primary-fg: #fefefe;
      --accent: #3a62ff24;
      --accent-fg: #2039a8;
      --identifier: #5b688f;
      --success: #2d9f63;
      --warning: #e8a42b;
      --danger: #e35d4d;
      --info: #4c6fff;
      --shadow-soft: 0 10px 40px #1118270d;
      --shadow-strong: 0 20px 60px #11182714;
      --font-display: "Plus Jakarta Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-body: "Manrope", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "IBM Plex Mono", "SF Mono", Monaco, monospace;
    }

    body.dark {
      --bg: #111318;
      --fg: #f5f7fb;
      --muted: #9ea5b3;
      --line: #ffffff1a;
      --panel: #12161dd6;
      --panel-strong: #181e27eb;
      --panel-muted: #ffffff0f;
      --shell: #0e1219c7;
      --primary: #f5f7fb;
      --primary-fg: #171719;
      --accent: #6784ff29;
      --accent-fg: #d7e2ff;
      --identifier: #b8c6ee;
      --shadow-soft: 0 14px 34px #02061757;
      --shadow-strong: 0 24px 56px #02061775;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body.dark { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--fg);
      background: var(--bg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button { cursor: pointer; }

    .background-plane {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .background-plane::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(54rem 30rem at 88% 10%, #6784ff26, transparent 72%),
        radial-gradient(40rem 28rem at 10% 90%, #f5ce8e1c, transparent 74%),
        linear-gradient(#fffdf8, #faf6ef 46%, #f2ede5);
    }

    body.dark .background-plane::before {
      background:
        radial-gradient(52rem 30rem at 84% 12%, #6784ff33, transparent 72%),
        radial-gradient(38rem 26rem at 12% 86%, #98a2b817, transparent 72%),
        linear-gradient(#141820, #10141b 44%, #0a0e14);
    }

    .background-plane svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .075;
      fill: none;
      stroke: #5b688f;
      stroke-width: 1.2;
    }

    body.dark .background-plane svg { opacity: .05; stroke: #b8c6ee; }

    .hide { display: none !important; }

    .icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .auth-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow-strong);
      backdrop-filter: blur(24px);
      padding: 38px;
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      box-shadow: 0 6px 18px #11182710;
    }

    .brand-mark svg {
      width: 36px;
      height: 36px;
    }

    .auth-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: 25px;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0;
    }

    .auth-subtitle {
      margin: 8px 0 32px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .16em;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
      padding: 0 13px;
      transition: border-color .18s, box-shadow .18s;
    }

    .input-shell:focus-within {
      border-color: #6784ff80;
      box-shadow: 0 0 0 4px #6784ff1c;
    }

    .input-shell input,
    .input-shell select,
    .input-shell textarea {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      min-width: 0;
    }

    .input-shell textarea {
      min-height: 84px;
      resize: vertical;
      padding: 12px 0;
    }

    .primary-btn,
    .ghost-btn,
    .chip-btn,
    .icon-btn {
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      transition: transform .18s, border-color .18s, background .18s, opacity .18s;
    }

    .primary-btn {
      width: 100%;
      color: var(--primary-fg);
      background: var(--primary);
      padding: 0 18px;
    }

    .ghost-btn {
      background: var(--panel);
      padding: 0 15px;
    }

    .chip-btn {
      min-height: 34px;
      padding: 0 12px;
      color: var(--muted);
      background: var(--panel);
      font-size: 13px;
    }

    .icon-btn {
      width: 42px;
      background: var(--panel);
    }

    .primary-btn:hover,
    .ghost-btn:hover,
    .chip-btn:hover,
    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: #6784ff66;
    }

    .chip-btn.active {
      color: var(--accent-fg);
      border-color: #3a62ff2e;
      background: var(--accent);
    }

    .auth-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .link {
      border: 0;
      padding: 0;
      color: var(--fg);
      background: none;
      font-weight: 700;
    }

    .alert {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 16px;
      border: 1px solid color-mix(in srgb, var(--danger) 32%, transparent);
      border-radius: 14px;
      background: color-mix(in srgb, var(--danger) 9%, transparent);
      color: var(--danger);
      padding: 12px;
      font-size: 14px;
    }

    .app-wrap {
      min-height: 100vh;
      padding: 22px;
    }

    .console-shell {
      position: relative;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: calc(100vh - 44px);
      border: 1px solid #ffffff99;
      border-radius: 28px;
      background: var(--shell);
      box-shadow: var(--shadow-strong);
      backdrop-filter: blur(24px);
      overflow: hidden;
    }

    body.dark .console-shell { border-color: #ffffff1a; }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-right: 1px solid var(--line);
      padding: 22px 18px;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px;
    }

    .sidebar-head .brand-mark {
      margin: 0;
      width: 44px;
      height: 44px;
      border-radius: 14px;
    }

    .sidebar-head .brand-mark svg {
      width: 29px;
      height: 29px;
    }

    .brand-name {
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 1.1;
    }

    .brand-caption {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .nav-group-label {
      margin: 18px 10px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .nav-list {
      display: grid;
      gap: 6px;
    }

    .nav-btn {
      width: 100%;
      min-height: 43px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: transparent;
      color: var(--muted);
      padding: 0 12px;
      text-align: left;
      font-weight: 700;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: var(--fg);
      border-color: var(--line);
      background: var(--panel);
    }

    .nav-btn.active {
      background: var(--accent);
      color: var(--accent-fg);
    }

    .sidebar-footer {
      margin-top: auto;
      display: grid;
      gap: 10px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: var(--primary-fg);
      background: var(--primary);
      font-weight: 800;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      padding: 16px 22px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .searchbar {
      width: min(440px, 100%);
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 0 13px;
    }

    .searchbar input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
    }

    .content {
      display: grid;
      gap: 18px;
      padding: 22px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .page-header {
      padding: 24px;
    }

    .header-flex {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-end;
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.05;
    }

    .desc {
      max-width: 780px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      min-width: 130px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--info);
      border-radius: 16px;
      background: var(--panel-strong);
      padding: 12px 14px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 5px;
      font-size: 24px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) repeat(3, minmax(140px, 180px));
      gap: 12px;
      padding: 16px;
    }

    .table-wrap {
      overflow: auto;
      border-radius: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 15px 16px;
      text-align: left;
      vertical-align: middle;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: color-mix(in srgb, var(--panel-muted) 86%, transparent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .18s; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent) 45%, transparent); }

    .mono {
      font-family: var(--font-mono);
      color: var(--identifier);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 0 10px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge.low { color: #1d6a43; background: #2d9f6314; border-color: #2d9f6338; }
    .badge.moderate { color: #9b6400; background: #e8a42b18; border-color: #e8a42b40; }
    .badge.high { color: #a62618; background: #e35d4d18; border-color: #e35d4d40; }
    .badge.severe { color: #842029; background: #ff4d6d1c; border-color: #ff4d6d55; }
    .badge.screening { color: var(--accent-fg); background: var(--accent); border-color: #3a62ff36; }
    .badge.completed { color: #1d6a43; background: #2d9f6314; border-color: #2d9f6338; }
    .badge.failed { color: #a62618; background: #e35d4d18; border-color: #e35d4d40; }

    body.dark .badge.low { color: #b4f3d2; }
    body.dark .badge.moderate { color: #fff0c6; }
    body.dark .badge.high,
    body.dark .badge.severe,
    body.dark .badge.failed { color: #fecaca; }

    .progress {
      width: 112px;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-muted);
    }

    .progress i {
      display: block;
      height: 100%;
      width: var(--value);
      border-radius: inherit;
      background: linear-gradient(90deg, #6784ff, #2d9f63);
    }

    .row-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .split {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 18px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .panel-body { padding: 20px; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-strong);
      padding: 15px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 22px;
    }

    .timeline {
      display: grid;
      gap: 14px;
    }

    .event {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 12px;
    }

    .event i {
      width: 10px;
      height: 10px;
      margin-top: 6px;
      border-radius: 999px;
      background: var(--info);
      box-shadow: 0 0 0 4px #6784ff1c;
    }

    .event strong {
      display: block;
      font-size: 14px;
    }

    .event span {
      color: var(--muted);
      font-size: 13px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .admin-tile {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-strong);
      padding: 18px;
    }

    .admin-tile .tile-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--panel-muted);
      color: var(--muted);
    }

    .admin-tile p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #11182766;
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel-strong);
      box-shadow: var(--shadow-strong);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 22px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .modal-body {
      padding: 22px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 22px 22px;
    }

    .toast {
      position: fixed;
      right: 24px;
      top: 24px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-strong);
      box-shadow: var(--shadow-soft);
      padding: 13px 15px;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: transform .2s, opacity .2s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 980px) {
      .console-shell { grid-template-columns: 1fr; }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .nav-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .filters,
      .split {
        grid-template-columns: 1fr;
      }
      .topbar {
        align-items: stretch;
        flex-direction: column;
      }
      .searchbar { width: 100%; }
    }

    @media (max-width: 620px) {
      .app-wrap { padding: 0; }
      .console-shell {
        min-height: 100vh;
        border-radius: 0;
      }
      .content,
      .topbar,
      .sidebar { padding: 16px; }
      .header-flex { align-items: flex-start; flex-direction: column; }
      .nav-list,
      .admin-grid,
      .metric-grid { grid-template-columns: 1fr; }
      .auth-card { padding: 28px 22px; }
    }

    .app-wrap {
      padding: 10px 24px 24px 84px;
      background:
        linear-gradient(90deg, #fbf6ed 0 58%, #f2f4fb 100%),
        var(--bg);
    }

    body.dark .app-wrap {
      background:
        linear-gradient(90deg, #121419 0 58%, #151923 100%),
        var(--bg);
    }

    .console-shell {
      display: block;
      min-height: calc(100vh - 34px);
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      overflow: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 15;
      width: 70px;
      height: 100vh;
      align-items: center;
      border-right: 1px solid #ece9e2;
      background: #ffffffd8;
      padding: 14px 10px;
      box-shadow: 18px 0 44px #1118270a;
    }

    body.dark .sidebar {
      border-color: var(--line);
      background: #11161dd8;
    }

    .sidebar-head {
      padding: 0;
    }

    .sidebar-head .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      color: #355cff;
      background: #fff;
    }

    .sidebar-head .brand-mark + div,
    .nav-group-label,
    .sidebar-footer,
    .nav-btn span {
      display: none;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
    }

    .nav-btn {
      width: 42px;
      height: 42px;
      min-height: 42px;
      justify-content: center;
      padding: 0;
      border-radius: 999px;
      color: #6b7280;
      font-size: 0;
    }

    .nav-btn .icon {
      width: 19px;
      height: 19px;
      font-size: 16px;
    }

    .nav-btn.active {
      color: #4c6fff;
      border-color: #dbe4ff;
      background: #eaf0ff;
    }

    .main {
      display: block;
    }

    }

    .txn-profile-kicker {
      color: #718096;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .txn-hash-line {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      color: #102039;
      font-size: 20px;
      font-weight: 850;
      line-height: 1.35;
      word-break: break-all;
    }

    .txn-profile-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .txn-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #dce8ff;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 850;
      padding: 6px 10px;
      white-space: nowrap;
    }

    .txn-chip.neutral {
      border-color: #e5e7eb;
      background: #f8fafc;
      color: #475569;
    }

    .txn-chip.danger {
      border-color: #fecaca;
      background: #fff1f2;
      color: #be123c;
    }

    .txn-screened-time {
      color: #718096;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      padding-top: 22px;
    }

    .txn-flow-strip {
      display: grid;
      grid-template-columns: minmax(190px, .95fr) minmax(170px, .65fr) minmax(220px, 1fr);
      gap: 14px;
      align-items: center;
      border: 1px solid #dbeafe;
      border-radius: 16px;
      background: linear-gradient(90deg, #f8fbff 0%, #fff 58%, #fff9f5 100%);
      padding: 18px;
      margin-top: 18px;
    }

    .txn-flow-node {
      border: 1px solid #d7e3f4;
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      min-width: 0;
      box-shadow: 0 8px 18px rgba(15, 23, 42, .04);
    }

    .txn-flow-node.risky {
      border-color: #fed7aa;
      background: #fffaf5;
    }

    .txn-flow-label {
      display: block;
      color: #8a97aa;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .txn-flow-value {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #102039;
      font-size: 14px;
      font-weight: 850;
      min-width: 0;
    }

    .txn-flow-value .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      max-width: 100%;
    }

    .txn-flow-edge {
      display: grid;
      justify-items: center;
      gap: 6px;
      color: #64748b;
      font-size: 12px;
      font-weight: 850;
      text-align: center;
    }

    .txn-flow-arrow {
      position: relative;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, #3b82f6, #f97316);
    }

    .txn-flow-arrow:after {
      content: "";
      position: absolute;
      top: 50%;
      right: -2px;
      width: 9px;
      height: 9px;
      border-top: 2px solid #f97316;
      border-right: 2px solid #f97316;
      transform: translateY(-50%) rotate(45deg);
      background: transparent;
    }

    .txn-info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px 18px;
    }

    .txn-info-item strong {
      word-break: break-word;
    }

    .txn-mini-copy {
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
    }

    .txn-rule-stack {
      display: grid;
      gap: 16px;
      margin-top: 18px;
    }

    .txn-rule-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .txn-rule-card {
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
      padding: 22px 24px 20px;
      text-align: left;
    }

    .txn-rule-card.active {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .12), 0 10px 24px rgba(15, 23, 42, .08);
      background: #fbfdff;
    }

    .txn-rule-card:before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: #ef4444;
    }

    .txn-rule-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .txn-rule-title h3 {
      margin: 0;
      color: #172033;
      font-size: 18px;
      font-weight: 800;
    }

    .txn-rule-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .txn-rule-metric {
      border: 1px solid #edf1f7;
      border-radius: 10px;
      background: #fbfcff;
      padding: 12px;
    }

    .txn-rule-metric span {
      display: block;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    .txn-rule-summary {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      padding: 18px 20px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .04);
    }

    .txn-rule-summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .txn-rule-summary-head h3 {
      margin: 0;
      color: #172033;
      font-size: 17px;
      font-weight: 900;
    }

    .txn-rule-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .txn-rule-summary-item {
      border: 1px solid #edf1f7;
      border-radius: 10px;
      background: #fbfcff;
      padding: 12px;
    }

    .txn-rule-summary-item span {
      display: block;
      color: #8a97aa;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .txn-rule-summary-item strong {
      color: #172033;
      font-size: 13px;
      font-weight: 850;
    }

    .txn-related-title {
      color: #475569;
      font-size: 13px;
      font-weight: 900;
      margin: 4px 0 10px;
    }

    .txn-entity-row {
      display: grid;
      grid-template-columns: 1fr 80px 120px auto;
      gap: 14px;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding: 12px 0;
      color: #334155;
      font-size: 14px;
    }

    .txn-entity-row.active {
      margin-inline: -10px;
      padding-inline: 10px;
      border-radius: 10px;
      background: #eff6ff;
      border-top-color: transparent;
    }

    tr.txn-entity-row.active {
      display: table-row;
      background: #eff6ff;
    }

    tr.txn-entity-row.active td {
      border-top-color: #bfdbfe;
      border-bottom-color: #bfdbfe;
    }

    .txn-graph-btn {
      border: 1px solid #dbeafe;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
    }

    .txn-graph-panel {
      border: 1px solid #dbe5f2;
      border-radius: 16px;
      background: #fbfdff;
      margin-top: 18px;
      padding: 18px;
      min-height: 300px;
    }

    .txn-graph-panel.fullscreen {
      position: fixed;
      inset: 24px;
      z-index: 120;
      display: flex;
      flex-direction: column;
      background: #fbfdff;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .28);
    }

    .txn-graph-panel.fullscreen .txn-graph-canvas {
      height: min(62vh, 680px);
    }

    .txn-graph-empty {
      min-height: 250px;
      display: grid;
      place-items: center;
      color: #94a3b8;
      font-weight: 700;
    }

    .txn-graph-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .txn-graph-head h3 {
      margin: 0 0 6px;
      color: #172033;
      font-size: 16px;
    }

    .txn-graph-subtitle {
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .txn-graph-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .txn-graph-control {
      border: 1px solid #dbe5f2;
      border-radius: 999px;
      background: #fff;
      color: #64748b;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 800;
    }

    .txn-graph-control.active {
      color: #2563eb;
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .txn-graph-select {
      border: 1px solid #dbe5f2;
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 7px 28px 7px 11px;
      font-size: 12px;
      font-weight: 800;
    }

    .txn-graph-canvas {
      position: relative;
      height: 340px;
      overflow: hidden;
      border-radius: 12px;
      cursor: grab;
      user-select: none;
      background:
        radial-gradient(#dbeafe 1px, transparent 1px) 0 0 / 22px 22px,
        linear-gradient(135deg, #fff, #f8fbff);
    }

    .txn-graph-canvas.dragging {
      cursor: grabbing;
    }

    .txn-graph-stage {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    .txn-node {
      position: absolute;
      min-width: 130px;
      border: 1px solid #dbeafe;
      border-radius: 999px;
      background: #fff;
      color: #172033;
      box-shadow: 0 8px 20px rgba(37, 99, 235, .08);
      padding: 10px 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
      z-index: 2;
      cursor: pointer;
    }

    .txn-node.source { left: 7%; top: 42%; border-color: #bfdbfe; }
    .txn-node.middle { left: 39%; top: 20%; border-color: #fed7aa; }
    .txn-node.target { right: 7%; top: 42%; border-color: #fecaca; }

    .txn-node.path-0 { right: 9%; top: 18%; }
    .txn-node.path-1 { right: 12%; top: 43%; }
    .txn-node.path-2 { right: 8%; top: 68%; }
    .txn-node.risk { border-color: #fb923c; }
    .txn-node.dim {
      opacity: .46;
      box-shadow: none;
    }
    .txn-node.selected {
      border-color: #2563eb;
      box-shadow: 0 10px 28px rgba(37, 99, 235, .18);
    }

    .txn-edge {
      position: absolute;
      height: 3px;
      background: #cbd5e1;
      transform-origin: left center;
      border-radius: 999px;
      opacity: .72;
      cursor: pointer;
      z-index: 1;
      border: 0;
      padding: 0;
    }

    .txn-edge.selected {
      height: 4px;
      background: linear-gradient(90deg, #2563eb, #f97316);
      opacity: 1;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .09);
    }

    .txn-edge.dim {
      opacity: .28;
      background: #cbd5e1;
    }

    .txn-edge.one { width: 240px; left: 19%; top: 51%; transform: rotate(-16deg); }
    .txn-edge.two { width: 250px; left: 50%; top: 35%; transform: rotate(18deg); }
    .txn-edge.main { width: 58%; left: 21%; top: 51%; transform: rotate(0deg); background: linear-gradient(90deg, #2563eb, #f97316); opacity: 1; }
    .txn-edge.path-0 { width: 62%; left: 20%; top: 31%; transform: rotate(-13deg); }
    .txn-edge.path-1 { width: 60%; left: 20%; top: 51%; transform: rotate(0deg); }
    .txn-edge.path-2 { width: 63%; left: 20%; top: 70%; transform: rotate(11deg); }

    .txn-edge-label {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      color: #475569;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
      pointer-events: none;
    }

    .txn-edge-label small {
      display: block;
      margin-top: 4px;
      color: #64748b;
      font-size: 11px;
      font-weight: 800;
    }

    .txn-graph-clickable:hover:after {
      content: attr(data-tooltip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%);
      min-width: max-content;
      max-width: 240px;
      border: 1px solid #dbe5f2;
      border-radius: 8px;
      background: #0f172a;
      color: #fff;
      padding: 7px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    .txn-edge.txn-graph-clickable:hover:after {
      left: 50%;
      bottom: 12px;
    }

    .txn-graph-caption {
      position: absolute;
      left: 22px;
      bottom: 18px;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
    }

    .txn-graph-hint {
      position: absolute;
      left: 22px;
      top: 18px;
      color: #8a97aa;
      font-size: 11px;
      font-weight: 800;
      background: rgba(255, 255, 255, .78);
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 9px;
      pointer-events: none;
    }

    .txn-graph-detail-card {
      margin-top: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      padding: 14px 16px;
    }

    .txn-graph-detail-card h4 {
      margin: 0 0 10px;
      color: #172033;
      font-size: 14px;
    }

    .txn-graph-detail-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 18px;
    }

    .txn-graph-detail-grid span {
      display: block;
      color: #94a3b8;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }

    .txn-graph-detail-grid strong {
      color: #334155;
      font-size: 12px;
      word-break: break-word;
    }

    .txn-exposure-section {
      border: 1px solid var(--rl-line);
      border-radius: 16px;
      background: #fff;
      padding: 18px 20px;
    }

    .overview-page {
      display: grid;
      gap: 22px;
      padding: 0 0 24px;
    }

    .overview-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .overview-title-row h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(32px, 4vw, 54px);
      line-height: .95;
      letter-spacing: 0;
    }

    .overview-range {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffffcc;
      color: var(--muted);
      padding: 0 14px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .overview-metric-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      box-shadow: var(--shadow-soft);
    }

    .overview-metric {
      min-height: 152px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      align-items: center;
      gap: 20px;
      padding: 32px 44px;
    }

    .overview-metric + .overview-metric {
      border-left: 1px solid var(--line);
    }

    .overview-metric span {
      display: block;
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .overview-metric strong {
      display: block;
      font-family: var(--font-display);
      font-size: 44px;
      line-height: 1;
      letter-spacing: .02em;
    }

    .overview-spark svg,
    .overview-trend-svg {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 22px;
    }

    .overview-card {
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #fff;
      box-shadow: var(--shadow-soft);
      padding: 34px 42px;
    }

    .overview-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .overview-card h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 24px;
      line-height: 1.1;
    }

    .overview-toggle {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #f8fafc;
    }

    .overview-toggle button {
      min-width: 72px;
      min-height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }

    .overview-toggle button.active {
      background: #fff;
      color: var(--fg);
      box-shadow: 0 6px 18px #0f172a12;
    }

    .overview-donut-layout {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) 220px;
      align-items: center;
      gap: 28px;
      min-height: 220px;
    }

    .overview-donut {
      width: min(310px, 100%);
      aspect-ratio: 1.55;
      position: relative;
      margin: 0 auto;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 46%, #fff 0 30%, transparent 31%),
        conic-gradient(from -90deg, #4f7cff 0 42%, #58c6df 42% 56%, #f7bf21 56% 76%, #ff642e 76% 100%);
      transform: perspective(520px) rotateX(58deg);
      box-shadow: inset 0 -20px 0 #00000012, 0 22px 34px #0f172a14;
    }

    .overview-donut::after {
      content: "";
      position: absolute;
      inset: 24% 32%;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 10px 24px #0f172a16;
    }

    .overview-legend {
      display: grid;
      gap: 10px;
    }

    .overview-legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 800;
    }

    .overview-legend-item b {
      font-size: 12px;
      color: var(--muted);
    }

    .risk-dot {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      border-radius: 4px;
      display: inline-block;
      margin-right: 8px;
    }

    .overview-chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      align-items: center;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .overview-chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .overview-chart-shell {
      min-height: 236px;
      display: grid;
      align-items: end;
    }

    .overview-table-card {
      padding: 34px 42px 24px;
    }

    .overview-risk-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .overview-risk-table th {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .14em;
      text-align: left;
      text-transform: uppercase;
      padding: 0 20px 18px;
      border-bottom: 1px solid var(--line);
    }

    .overview-risk-table td {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      font-weight: 700;
    }

    .overview-risk-table tr:last-child td {
      border-bottom: 0;
    }

    .overview-hash {
      color: #2563eb;
      font-weight: 900;
    }

    .overview-rule-chip,
    .chain-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 8px;
      background: #eef2f7;
      padding: 6px 9px;
      font-size: 13px;
      font-weight: 900;
      color: #334155;
    }

    .chain-pill .coin {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      background: #f59e0b;
    }

    .chain-pill.eth .coin { background: #627eea; }
    .chain-pill.bnb .coin { background: #f3ba2f; color: #111827; }

    @media (max-width: 1100px) {
      .rl-three,
      .rl-rules {
        grid-template-columns: 1fr;
      }

      .rl-flow-grid,
      .rl-flow-legend {
        grid-template-columns: 1fr;
      }

      .txn-info-grid,
      .txn-rule-grid,
      .txn-rule-metrics,
      .txn-rule-summary-grid,
      .txn-flow-strip {
        grid-template-columns: 1fr;
      }

      .txn-detail-head {
        grid-template-columns: 1fr;
        flex-direction: column;
      }

      .txn-screened-time {
        padding-top: 0;
      }

      .txn-flow-edge {
        justify-items: stretch;

    function bindGraphViewer() {
      const canvas = qs('[data-graph-canvas]');
      if (!canvas) return;
      const hint = qs('.txn-graph-hint');
      if (hint) hint.textContent = 'Drag to pan · Scroll to zoom · Click node to view details';
      applyGraphTransform();
      canvas.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.txn-graph-clickable')) return;
        graphDragging = true;
        graphDragStart = { x: event.clientX, y: event.clientY, panX: graphPanX, panY: graphPanY };
        canvas.classList.add('dragging');
        canvas.setPointerCapture?.(event.pointerId);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (!graphDragging || !graphDragStart) return;
        graphPanX = graphDragStart.panX + event.clientX - graphDragStart.x;
        graphPanY = graphDragStart.panY + event.clientY - graphDragStart.y;
        applyGraphTransform();
      });
      const endDrag = (event) => {
        graphDragging = false;
        graphDragStart = null;
        canvas.classList.remove('dragging');
        if (event && canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
      };
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', endDrag);
      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;
        const oldZoom = graphZoom;
        const nextZoom = Math.max(0.5, Math.min(2.5, oldZoom * (event.deltaY < 0 ? 1.12 : 0.88)));
        const worldX = (mouseX - graphPanX) / oldZoom;
        const worldY = (mouseY - graphPanY) / oldZoom;
        graphZoom = nextZoom;
        graphPanX = mouseX - worldX * nextZoom;
        graphPanY = mouseY - worldY * nextZoom;
        applyGraphTransform();
      }, { passive: false });
    }

              </div>
            </article>
          </section>

          <section class="overview-card overview-table-card">
            <div class="overview-card-head">
              <h2>Recent High &amp; Severe Risk Transactions</h2>
              <div class="overview-toggle" aria-label="Recent risk type">
                <button class="active" type="button" data-overview-toggle="recent">Txn</button>
                <button type="button" data-overview-toggle="recent">Address</button>
              </div>
            </div>
            <table class="overview-risk-table">
              <thead>
                <tr>
                  <th>TX Hash</th>
                  <th>Risk Level</th>
                  <th>Triggered Rules</th>
                  <th>Value</th>
                  <th>Chain</th>
                  <th>Triggered Time</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><span class="overview-hash">5a8d...f321</span></td>
                  <td><span class="risk-dot" style="background:#ff642e"></span>Severe</td>
                  <td><span class="overview-rule-chip">Mixer Usage</span> <span class="overview-rule-chip">+2</span></td>
                  <td>$42,500.00</td>
                  <td><span class="chain-pill"><span class="coin">B</span>BTC</span></td>
                  <td>Jan 18, 16:45</td>
                </tr>
                <tr>
                  <td><span class="overview-hash">9a1b...214d</span></td>
                  <td><span class="risk-dot" style="background:#f7bf21"></span>High</td>
                  <td><span class="overview-rule-chip">Illicit Activity</span></td>
                  <td>$12,000.00</td>
                  <td><span class="chain-pill eth"><span class="coin">E</span>Ethereum</span></td>
                  <td>Jan 17, 16:45</td>
                </tr>
                <tr>
                  <td><span class="overview-hash">2a4f...00c1</span></td>
                  <td><span class="risk-dot" style="background:#ff642e"></span>Severe</td>
                  <td><span class="overview-rule-chip">Illicit Activity</span></td>
                  <td>$150,000.00</td>
                  <td><span class="chain-pill bnb"><span class="coin">B</span>BNB</span></td>
                  <td>Jan 7, 16:45</td>
                </tr>
              </tbody>
            </table>
          </section>
        </section>
      `;
      qs('#overviewRange').addEventListener('click', () => showToast('Date range selector simulated'));
      qsa('[data-overview-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const group = btn.dataset.overviewToggle;
          qsa(`[data-overview-toggle="${group}"]`).forEach(item => item.classList.toggle('active', item === btn));
          showToast(btn.textContent.trim() + ' view selected');
        });
      });
    }

    function renderAdmin() {
      qs('#content').innerHTML = header([
        { label: 'API calls', value: '84.2K', color: '#4c6fff' },
        { label: 'Members', value: '12', color: '#2d9f63' },
        { label: 'Usage', value: '68%', color: '#e8a42b' }
      ]) + `
        <section class="panel">
          <div class="panel-body admin-grid">
            ${[
              ['API Keys', 'Create, rotate, and revoke application keys for screening endpoints.'],
              ['Plan Usage', 'Track quota, throughput, and historical screening volume.'],
              ['Roles', 'Configure admin, analyst, auditor, and member permissions.'],
              ['Organization', 'Invite users, review account locks, and manage membership.']
            ].map(([title, desc]) => `
              <button class="admin-tile" type="button">
                <span class="tile-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M15 7h.01"></path><path d="M10 12a5 5 0 1 1 3.5 1.5L6 21l-3-3 7.5-7.5A5 5 0 0 1 10 12Z"></path></svg></span>
                <span><h3>${title}</h3><p>${desc}</p></span>
              </button>
            `).join('')}
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Risk Settings</h2><button class="chip-btn" id="saveSettings" type="button">Save changes</button></div>
          <div class="panel-body">
            <div style="display:flex;flex-wrap:wrap;gap:10px">
              <button class="chip-btn active">CEX Interaction</button>
              <button class="chip-btn active">Mixer Exposure</button>
              <button class="chip-btn">Fast Turnover</button>
              <button class="chip-btn active">Ransomware Exposure</button>
              <button class="chip-btn">Burst Large Transfer</button>
            </div>
          </div>
        </section>
      `;
      bindPageActions();
      qs('#saveSettings').addEventListener('click', () => showToast('Risk settings saved'));
      qsa('.admin-tile').forEach(tile => tile.addEventListener('click', () => showToast(tile.querySelector('h3').textContent + ' opened')));
      qsa('.panel-body .chip-btn').forEach(btn => btn.addEventListener('click', () => btn.classList.toggle('active')));
    }

    function bindPageActions() {
      const newBtn = qs('#newTaskBtn');
      if (newBtn) newBtn.addEventListener('click', openModal);
      const markAll = qs('#markAllBtn');
      if (markAll) markAll.addEventListener('click', () => showToast('Activity marked as read'));
      qsa('.rerun').forEach(btn => {
        btn.addEventListener('click', () => {
          const item = tasks.find(x => x.id === btn.dataset.id);
          if (item) {
            item.status = 'screening';
            item.progress = 12;
            item.updated = 'just now';
            showToast('Rescreen started for ' + item.id);
            render();
          }
        });
      });
      const openDetail = (id) => {
        if (!id) return;
        selectedDetailId = id;
        selectedHistorySnapshot = null;
        selectedGraphEntity = null;
        selectedTxnRuleIndex = null;
        activePage = 'detail';
        detailTab = 'rules';
        render();
      };
      qsa('.view-detail').forEach(btn => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          openDetail(btn.dataset.id);
        });
      });
      qsa('.detail-row').forEach(row => {
        row.addEventListener('click', () => {
          openDetail(row.dataset.id);
        });
      });
      qsa('.history-link').forEach(btn => {
        btn.addEventListener('click', () => {
          openDetail(btn.dataset.id);
        });
      });
    }

    function render() {
      const titleMap = {
        overview: 'Overview',
        ctcheck: 'CT Check',
        ctmonitor: 'CT Monitor',
        admin: 'Administration',
        detail: 'ChainTrust Console'
      };
      qs('#topbarTitle').textContent = titleMap[activePage] || 'Overview';
      qsa('.nav-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.page === activePage || (activePage === 'detail' && btn.dataset.page === 'ctcheck')));
      if (activePage === 'overview') return renderOverview();
      if (activePage === 'detail') return renderDetail(selectedDetailId);
      if (activePage === 'ctcheck') return renderScreening('address');
      if (activePage === 'ctmonitor') return renderScreening('transaction');
      renderAdmin();
    }

    function openModal() {
      const meta = getPageMeta();
      modalMode = meta.kind;
      qs('#modalTitle').textContent = meta.action;
      qs('#modalDescription').textContent = modalMode === 'transaction'
        ? 'Submit a transaction hash, direction, and output address.'
        : modalMode === 'admin'
          ? 'Invite a teammate to the organization.'
          : 'Submit a wallet address for CT Check screening.';

      qs('#modalFields').innerHTML = modalMode === 'transaction' ? `
        <div class="field"><label>Transaction hash</label><div class="input-shell"><input name="tx" required placeholder="0xbe129f2c1bc49cc92410dd0855af0ac4b47fb6362d31fc5c1e940672856535ac"></div></div>
        <div class="field"><label>Direction</label><div class="input-shell"><select name="direction"><option>deposit</option><option>withdraw</option></select></div></div>
        <div class="field"><label>Output address</label><div class="input-shell"><input name="address" required placeholder="0x1234567890abcdef1234567890abcdef12345678"></div></div>
      ` : modalMode === 'admin' ? `
        <div class="field"><label>Email</label><div class="input-shell"><input name="email" type="email" required placeholder="analyst@example.com"></div></div>
        <div class="field"><label>Role</label><div class="input-shell"><select name="role"><option>analyst</option><option>auditor</option><option>member</option><option>admin</option></select></div></div>
      ` : `
        <div class="field"><label>Address</label><div class="input-shell"><input name="address" required placeholder="0x742d35Cc6634C0532925a3b844Bc9e7595f5bB32"></div></div>
        <div class="field"><label>Chain</label><div class="input-shell"><select name="chain"><option>holistic</option><option>ETH</option><option>BTC</option><option>TRX</option><option>BSC</option></select></div></div>
      `;
      qs('#modalBackdrop').classList.remove('hide');
      qs('#modalFields input, #modalFields textarea, #modalFields select')?.focus();
    }

    function closeModal() {
      qs('#modalBackdrop').classList.add('hide');
      qs('#screeningForm').reset();
    }

    function createTask(event) {
      event.preventDefault();
      if (modalMode === 'transaction') {
        const tx = new FormData(event.target).get('tx') || '0x' + Math.random().toString(16).slice(2).padEnd(64, '0');
        tasks.unshift({ id: 'TX-' + Math.floor(9100 + Math.random() * 99), kind: 'transaction', chain: 'ETH', subject: tx, entity: 'Pending classification', risk: 'moderate', status: 'screening', progress: 8, rules: 'Pending', value: '-', updated: 'just now' });
      } else if (modalMode === 'address') {
        const address = new FormData(event.target).get('address') || '0x0000000000000000000000000000000000000000';
        tasks.unshift({ id: 'CT-' + Math.floor(1040 + Math.random() * 99), kind: 'address', chain: 'ETH', subject: address, entity: 'Pending classification', risk: 'low', status: 'screening', progress: 8, rules: 'Pending', value: '-', updated: 'just now' });
      }
      closeModal();
      showToast(modalMode === 'admin' ? 'Invitation sent' : 'Task created');
      render();
    }

    function startProgressLoop() {
      setInterval(() => {
        let changed = false;
        tasks.forEach(item => {
          if (item.status === 'screening') {
            item.progress = Math.min(100, item.progress + Math.floor(5 + Math.random() * 12));
            changed = true;
            if (item.progress >= 100) {
              item.status = 'completed';
              item.risk = ['low', 'moderate', 'high'][Math.floor(Math.random() * 3)];
              item.rules = item.risk === 'low' ? 'No hit' : 'Rule match +1';
              item.updated = 'just now';
            }
          }
        });
        if (changed && !qs('#appView').classList.contains('hide')) render();
      }, 2600);
    }

    qs('#loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const error = qs('#loginError');
      const errorText = error.querySelector('span');
      const email = qs('#emailInput').value.trim();
      const password = qs('#passwordInput').value.trim();
      const mfaVisible = !qs('#mfaStep').classList.contains('hide');
      error.classList.add('hide');

      if (!mfaVisible) {
        if (!email || !password) {
          errorText.textContent = 'Email and password are required.';
          error.classList.remove('hide');
          return;
        }
        if (/locked/i.test(email)) {
          errorText.textContent = 'Account locked. Please reset your password to continue.';
          error.classList.remove('hide');
          return;
        }
        qs('#credentialsStep').classList.add('hide');
        qs('#mfaStep').classList.remove('hide');
        qs('#authSubtitle').textContent = 'Enter your two-factor code';
        qs('#loginButton').textContent = 'Verify and enter';
        qs('#mfaInput').focus();
        return;
      }

      if (qs('#mfaInput').value.trim().length !== 6) {
        errorText.textContent = 'Enter any 6 digit verification code.';
        error.classList.remove('hide');
        return;
      }
      qs('#authView').classList.add('hide');
      qs('#appView').classList.remove('hide');
      render();
      showToast('Signed in as Admin User');
    });

    qs('#forgotBtn').addEventListener('click', () => showToast('Password reset link simulated'));
    qs('#logoutBtn').addEventListener('click', () => {
      qs('#appView').classList.add('hide');
      qs('#authView').classList.remove('hide');
      qs('#credentialsStep').classList.remove('hide');
      qs('#mfaStep').classList.add('hide');
      qs('#authSubtitle').textContent = 'Sign in to continue';
      qs('#loginButton').textContent = 'Sign in';
      qs('#mfaInput').value = '';
    });
    qs('#themeBtn').addEventListener('click', () => document.body.classList.toggle('dark'));
    qs('#exportBtn').addEventListener('click', () => showToast('CSV export simulated'));
    qs('#modalClose').addEventListener('click', closeModal);
    qs('#cancelModal').addEventListener('click', closeModal);
    qs('#modalBackdrop').addEventListener('click', (event) => {
      if (event.target.id === 'modalBackdrop') closeModal();
    });
    qs('#screeningForm').addEventListener('submit', createTask);
    qsa('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
      activePage = btn.dataset.page;
        selectedDetailId = null;
        selectedHistorySnapshot = null;
        selectedGraphEntity = null;
        selectedTxnRuleIndex = null;
        search = '';
        filters = { risk: 'all', status: 'all', category: 'all' };
        render();
      });
    });

    render();
    startProgressLoop();
  </script>
</body>
</html>
